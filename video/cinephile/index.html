<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --encre: #f4f1fb;
        --encre-douce: rgba(244, 241, 251, 0.88);
        --violet: #8b5cf6;
        --violet-clair: #c4b5fd;
        --vert: #4ade80;
        --orange: #fb923c;
        --carte: rgba(22, 18, 38, 0.86);
        --bord: rgba(255, 255, 255, 0.14);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #151129; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Inter, sans-serif; color: var(--encre); }

      /* Le ciel de l'application, décor permanent du film. */
      #ciel { position: absolute; inset: 0; overflow: hidden; }
      #ciel-fond {
        position: absolute; inset: -40px;
        background:
          radial-gradient(ellipse 28% 22% at 34% 24%, rgba(255, 196, 170, 0.5), transparent 70%),
          radial-gradient(ellipse 34% 30% at 26% 30%, rgba(236, 150, 160, 0.36), transparent 70%),
          radial-gradient(ellipse 30% 12% at 78% 12%, rgba(232, 140, 175, 0.32), transparent 70%),
          radial-gradient(ellipse 18% 10% at 86% 63%, rgba(255, 214, 150, 0.8), transparent 70%),
          radial-gradient(ellipse 55% 22% at 82% 62%, rgba(255, 150, 110, 0.42), transparent 70%),
          linear-gradient(180deg, #3a2e7c 0%, #5a45a6 26%, #8f6cc4 46%, #c48bbf 58%, #6f4f97 70%, #2b2350 84%, #151129 100%);
      }
      #ciel-collines { position: absolute; left: -40px; bottom: 0; width: 2000px; height: 380px; }

      /* Pièces communes aux scènes. */
      .sc { position: absolute; inset: 0; font-family: Inter, sans-serif; color: var(--encre); text-shadow: 0 2px 16px rgba(30, 14, 64, 0.35); }
      .etq { font-size: 28px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet-clair); }
      .titre { font-size: 96px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
      .ligne { font-size: 40px; font-weight: 400; color: var(--encre-douce); line-height: 1.3; }
      .chiffre { font-size: 220px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.9; }
      .mot { display: inline-block; }
      .question {
        display: inline-flex; align-items: center; gap: 20px; padding: 24px 36px; border-radius: 22px;
        background: var(--carte); border: 1px solid var(--bord); font-size: 36px; font-weight: 500;
        box-shadow: 0 24px 60px rgba(12, 6, 30, 0.5);
      }
      .question .icone { width: 40px; height: 40px; border-radius: 10px; background: var(--violet); display: grid; place-items: center; font-weight: 900; font-size: 24px; }
      .ecran { border-radius: 18px; box-shadow: 0 30px 80px rgba(10, 5, 25, 0.55); display: block; }
      .affiche { border-radius: 12px; box-shadow: 0 24px 60px rgba(10, 5, 25, 0.6); display: block; object-fit: cover; }
      .badge { display: inline-block; padding: 8px 18px; border-radius: 10px; font-size: 28px; font-weight: 700; }
      .badge.vert { background: rgba(74, 222, 128, 0.18); color: var(--vert); }
      .badge.orange { background: rgba(251, 146, 60, 0.18); color: var(--orange); }
      .badge.violet { background: rgba(139, 92, 246, 0.28); color: var(--violet-clair); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="204" data-width="1920" data-height="1080">
      <div id="ciel" class="clip" data-start="0" data-duration="204" data-track-index="0" data-track-kind="graphics">
        <div id="ciel-fond"></div>
        <svg id="ciel-collines" viewBox="0 0 1440 320" preserveAspectRatio="none">
          <path fill="#4a3878" fill-opacity=".55" d="M0 170 C 240 110 430 160 630 132 C 850 100 1040 150 1240 112 C 1340 95 1400 102 1440 108 L1440 320 L0 320Z" />
          <path fill="#2c2150" fill-opacity=".88" d="M0 228 C 200 190 380 226 560 206 C 760 182 960 236 1160 212 C 1300 197 1390 206 1440 214 L1440 320 L0 320Z" />
          <path fill="#161129" d="M0 280 C 260 254 520 286 760 270 C 1000 254 1220 286 1440 272 L1440 320 L0 320Z" />
        </svg>
      </div>

      <div id="s01" data-composition-id="s01" data-composition-src="compositions/s01-accroche.html" data-start="0" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s02" data-composition-id="s02" data-composition-src="compositions/s02-titre.html" data-start="10" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s03" data-composition-id="s03" data-composition-src="compositions/s03-niveaux.html" data-start="20" data-duration="16" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s04" data-composition-id="s04" data-composition-src="compositions/s04-niveau0.html" data-start="36" data-duration="14" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s05" data-composition-id="s05" data-composition-src="compositions/s05-niveau1.html" data-start="50" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s06" data-composition-id="s06" data-composition-src="compositions/s06-niveau2.html" data-start="63" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s07" data-composition-id="s07" data-composition-src="compositions/s07-niveau3.html" data-start="76" data-duration="18" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s08" data-composition-id="s08" data-composition-src="compositions/s08-trace.html" data-start="94" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s09" data-composition-id="s09" data-composition-src="compositions/s09-abstention.html" data-start="106" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s10" data-composition-id="s10" data-composition-src="compositions/s10-tache.html" data-start="119" data-duration="17" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s11" data-composition-id="s11" data-composition-src="compositions/s11-confirmation.html" data-start="136" data-duration="12" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s12" data-composition-id="s12" data-composition-src="compositions/s12-liste.html" data-start="148" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s13" data-composition-id="s13" data-composition-src="compositions/s13-bilan.html" data-start="159" data-duration="21" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s14" data-composition-id="s14" data-composition-src="compositions/s14-faille.html" data-start="180" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s15" data-composition-id="s15" data-composition-src="compositions/s15-fin.html" data-start="191" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Le ciel dérive très lentement : le monde vit sans que rien ne « respire ».
      tl.fromTo("#ciel-fond", { x: 0 }, { x: -30, duration: 204, ease: "none" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
