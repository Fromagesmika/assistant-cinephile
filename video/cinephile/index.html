    <style>
      :root {
        --encre: #f4f1fb;
        --encre-douce: rgba(244, 241, 251, 0.88);
        --violet: #8b5cf6;
        --violet-clair: #c4b5fd;
        --vert: #4ade80;
        --orange: #fb923c;
        --carte: rgba(22, 18, 38, 0.86);
        --bord: rgba(255, 255, 255, 0.14);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #151129; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Inter, sans-serif; color: var(--encre); }

      /* Le ciel de l'application, décor permanent du film. */
      #ciel { position: absolute; inset: 0; overflow: hidden; }
      #ciel-fond {
        position: absolute; inset: -40px;
        background:
          radial-gradient(ellipse 28% 22% at 34% 24%, rgba(255, 196, 170, 0.5), transparent 70%),
          radial-gradient(ellipse 34% 30% at 26% 30%, rgba(236, 150, 160, 0.36), transparent 70%),
          radial-gradient(ellipse 30% 12% at 78% 12%, rgba(232, 140, 175, 0.32), transparent 70%),
          radial-gradient(ellipse 18% 10% at 86% 63%, rgba(255, 214, 150, 0.8), transparent 70%),
          radial-gradient(ellipse 55% 22% at 82% 62%, rgba(255, 150, 110, 0.42), transparent 70%),
          linear-gradient(180deg, #3a2e7c 0%, #5a45a6 26%, #8f6cc4 46%, #c48bbf 58%, #6f4f97 70%, #2b2350 84%, #151129 100%);
      }
      #ciel-collines { position: absolute; left: -40px; bottom: 0; width: 2000px; height: 380px; }

      /* Pièces communes aux scènes. */
      .sc { position: absolute; inset: 0; font-family: Inter, sans-serif; color: var(--encre); text-shadow: 0 2px 16px rgba(30, 14, 64, 0.35); }
      .etq { font-size: 28px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--violet-clair); }
      .titre { font-size: 96px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
      .ligne { font-size: 40px; font-weight: 400; color: var(--encre-douce); line-height: 1.3; }
      .chiffre { font-size: 220px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.9; }
      .mot { display: inline-block; }
      .question {
        display: inline-flex; align-items: center; gap: 20px; padding: 24px 36px; border-radius: 22px;
        background: var(--carte); border: 1px solid var(--bord); font-size: 36px; font-weight: 500;
        box-shadow: 0 24px 60px rgba(12, 6, 30, 0.5);
      }
      .question .icone { width: 40px; height: 40px; border-radius: 10px; background: var(--violet); display: grid; place-items: center; font-weight: 900; font-size: 24px; }
      .ecran { border-radius: 18px; box-shadow: 0 30px 80px rgba(10, 5, 25, 0.55); display: block; }
      .affiche { border-radius: 12px; box-shadow: 0 24px 60px rgba(10, 5, 25, 0.6); display: block; object-fit: cover; }
      .badge { display: inline-block; padding: 8px 18px; border-radius: 10px; font-size: 28px; font-weight: 700; }
      .badge.vert { background: rgba(74, 222, 128, 0.18); color: var(--vert); }
      .badge.orange { background: rgba(251, 146, 60, 0.18); color: var(--orange); }
      .badge.violet { background: rgba(139, 92, 246, 0.28); color: var(--violet-clair); }
    </style>
